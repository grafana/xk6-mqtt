name: Release

permissions: {}

on:
  push:
    tags: ["v*.*.*"]

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.go-versions.outputs.current }}
    steps:
      - name: Resolve Go versions
        id: go-versions
        uses: grafana/k6-ci/.github/actions/go-versions@03469f9ae7aad25369827832c456e8f8b7b8c1c2 # v0.5.0

  release:
    name: Release
    needs: configure
    uses: grafana/xk6/.github/workflows/extension-release.yml@91a2daa34184f3481aa29d571a287e1920b1c0dc # v1.4.8
    permissions:
      contents: write
    with:
      go-version: ${{ needs.configure.outputs.current }}
      os: '["linux", "windows", "darwin"]'
      arch: '["amd64", "arm64"]'
      k6-version: "v2.0.0-rc1"
      xk6-version: "1.4.1"
      private: true
